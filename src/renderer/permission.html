<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="./permission.css" />
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 2.7a5.3 5.3 0 0 0-5.3 5.3v2.4a3 3 0 0 0-1 2.2v4.6a3.4 3.4 0 0 0 3.4 3.4h5.8a3.4 3.4 0 0 0 3.4-3.4v-4.6a3 3 0 0 0-1-2.2V8a5.3 5.3 0 0 0-5.3-5.3zM9.3 8a2.7 2.7 0 1 1 5.4 0v2.2H9.3V8z"/></svg>
    </div>
    <h1>划词工具条需要「辅助功能」权限</h1>
    <p class="desc">
      授权后才能监听鼠标划选并读取选中文字。请在
      <b>系统设置 → 隐私与安全性 → 辅助功能</b>
      中勾选<span id="target-app" class="app">GLM问问</span>：
    </p>
    <ol class="steps">
      <li>点击下方「打开系统设置」（或已打开则直接切换）</li>
      <li>在列表中找到<span class="app" id="target-app2">GLM问问</span>并打开开关</li>
      <li>回来点击「重新检测」—— <b>成功后立即生效，无需重启</b></li>
    </ol>
    <div class="btns">
      <button id="open-pane" class="primary">打开系统设置</button>
      <button id="recheck" class="ghost">重新检测</button>
      <button id="later" class="ghost subtle">稍后再说</button>
    </div>
    <p id="status" class="status"></p>
  </div>
  <script src="./permission.js"></script>
</body>
</html>
